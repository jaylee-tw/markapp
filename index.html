<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>開啟 App</title>

<script>

const iosStore =
"https://apps.apple.com/tw/app/id123456789";

const androidStore =
"https://play.google.com/store/apps/details?id=com.example.markapp";

const appScheme =
"markapp://";

const ua = navigator.userAgent;

function openApp(){

    //先嘗試開啟 APP
    location.href = appScheme;

    //1.5 秒後未開啟則導商店
    setTimeout(function(){

        if(/iPhone|iPad|iPod/i.test(ua))
        {
            location.href = iosStore;
        }
        else if(/Android/i.test(ua))
        {
            location.href = androidStore;
        }

    },1500);

}

window.onload = openApp;

</script>

</head>

<body>

<h2>正在開啟 APP...</h2>

若未自動跳轉請稍候

</body>
</html>
