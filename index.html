<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>下載 APP</title>

<script>
const iosStore =
"https://apps.apple.com/tw/app/id6779522336";

const androidStore =
"https://play.google.com/store/apps/details?id=com.mrmark.app";

const website =
"https://mrmark.com.tw";

window.onload = function () {

    const ua = navigator.userAgent;

    if (/iPhone|iPad|iPod/i.test(ua)) {

        location.replace(iosStore);

    } else if (/Android/i.test(ua)) {

        location.replace(androidStore);

    } else {

        location.replace(website);

    }

}
</script>

</head>

<body>

<h2>正在導向下載頁面...</h2>

</body>
</html>
